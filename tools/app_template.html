<style>
/* Layout: one narrow column on a plain, quiet ground; sticky top bar, fixed thumb bar at the bottom. */

  --shadow: 0 1px 2px rgba(23, 33, 45, 0.06), 0 4px 14px rgba(23, 33, 45, 0.05);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;

}

    --grid: rgba(122, 167, 232, 0.05); --accent: #7aa7e8; --accent-ink: #0d1520; --accent-soft: #1b2a40;
    --crimson: #f0738a; --good: #52c48d; --good-soft: #15301f; --bad: #f2786b; --bad-soft: #3a1c19;
    --warn: #e5b350; --warn-soft: #3a2c12; --none: #232d3a; --banner-bg: #1b2a40; --banner-fg: #e5eaf1;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141b; --sheet: #161e29; --ink: #e5eaf1; --muted: #9ba7b6; --line: #2a3544;
  --grid: rgba(122, 167, 232, 0.05); --accent: #7aa7e8; --accent-ink: #0d1520; --accent-soft: #1b2a40;
  --crimson: #f0738a; --good: #52c48d; --good-soft: #15301f; --bad: #f2786b; --bad-soft: #3a1c19;
  --warn: #e5b350; --warn-soft: #3a2c12; --none: #232d3a; --banner-bg: #1b2a40; --banner-fg: #e5eaf1;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);

}
* { box-sizing: border-box; }

  line-height: 1.5;

}

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 120px; }

/* top bar */

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--r); border: 1px solid var(--line); background: var(--sheet); padding: 12px 18px; min-height: 50px; font-weight: 700; cursor: pointer; text-decoration: none; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--sheet); flex-wrap: wrap; }

.continue { border: 2px solid var(--accent); background: var(--accent-soft); }

.mode { text-align: left; display: grid; gap: 2px; padding: 12px 16px; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; min-height: 72px; box-shadow: var(--shadow); }
.mode:hover { border-color: var(--accent); }
.mode .mname { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }

.count { font-family: var(--f-mono); font-size: 0.8rem; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 8px; font-weight: 600; }
.count.hot { background: var(--bad-soft); color: var(--bad); }

/* badges */
.rb { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-mono); font-weight: 600; font-size: 0.78rem; padding: 2px 8px; border-radius: 6px; border: 1px solid transparent; white-space: nowrap; }
.rb.r-hi { background: var(--crimson); color: var(--sheet); }

.chip { display: inline-block; font-size: 0.76rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

.qmeta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.86rem; color: var(--muted); }
.qmeta .qid { margin-left: auto; font-family: var(--f-mono); }
.stem { font-size: 1.14rem; line-height: 1.55; overflow-wrap: anywhere; }

.opt:hover:not(:disabled) { border-color: var(--accent); }

.feedback { border-radius: 14px; padding: 14px 16px; border: 1px solid var(--line); background: var(--sheet); display: grid; gap: 8px; }

/* bottom bar */
.bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--sheet) 94%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }

.navgrid { display: grid; gap: 8px; }

.navch .rl { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); padding-top: 12px; }

.cell { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); font-family: var(--f-mono); font-size: 0.85rem; cursor: pointer; padding: 0; position: relative; min-height: 42px; }
.sheet-actions { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); background: var(--sheet); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; border-top: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 10px 0; min-height: 44px; cursor: pointer; text-align: left; }
.cell.ans { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cell.cur { outline: 3px solid var(--crimson); outline-offset: 1px; }
.cell.flag::after { content: ""; position: absolute; top: 2px; right: 2px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 1.5px var(--sheet); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); display: inline-block; }

/* overlay */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10, 15, 22, 0.5); display: flex; align-items: flex-end; justify-content: center; overscroll-behavior: contain; }
body.layer-open { overflow: hidden; }
.sheet { background: var(--sheet); width: 100%; max-width: 720px; max-height: 88%; overflow: auto; overscroll-behavior: contain; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
@media (min-width: 760px) { .overlay { align-items: center; } .sheet { border-radius: 18px; } }

.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }

.bars { display: grid; gap: 8px; }

.today { display: grid; gap: 10px; margin-block: 12px; }

.rules { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

.study.covered .sq.open .selfmark { display: flex; }
.fc-exp .selfmark { display: flex; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: 0.92rem; }
.heat { display: grid; grid-template-columns: 50px repeat(6, minmax(0, 1fr)); gap: 4px; align-items: stretch; }

.hc { border-radius: 7px; padding: 6px 2px; text-align: center; font-family: var(--f-mono); font-size: 0.72rem; line-height: 1.2; min-height: 44px; display: grid; place-content: center; border: 1px solid transparent; cursor: pointer; color: var(--ink); background: var(--none); }

.hc.na { color: var(--muted); }
details { border-top: 1px solid var(--line); padding-block: 6px; }
details > summary { cursor: pointer; font-weight: 700; padding-block: 6px; list-style-position: outside; }
.table-wrap { overflow-x: auto; }

.review-item { display: grid; gap: 8px; padding-block: 14px; border-top: 1px solid var(--line); }

.ro { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 4px 8px; border-radius: 8px; }

.picker { display: grid; gap: 8px; }

.pick[aria-pressed="true"] { background: var(--accent-soft); }
.pick .no { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; color: var(--crimson); }
.pick .nm { min-width: 0; }
.toggle { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
textarea { width: 100%; min-height: 140px; font-family: var(--f-mono); font-size: 0.78rem; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; z-index: 60; font-weight: 700; max-width: calc(100% - 32px); }

  .feedback { animation: rise 0.18s ease-out; }

}
/* flashcards: an index card with a crimson head rule, flipped in place */
.fc-head { display: grid; gap: 6px; }
.fc-stage { perspective: 1400px; }
.fcard { background: var(--sheet); border: 1px solid var(--line); border-top: 4px solid var(--crimson); border-radius: 16px; padding: 14px 16px 18px; box-shadow: var(--shadow); display: grid; gap: 12px; cursor: pointer; transform-origin: center; min-height: 300px; align-content: start;
  background-image: linear-gradient(transparent 47px, color-mix(in srgb, var(--crimson) 35%, transparent) 47px, color-mix(in srgb, var(--crimson) 35%, transparent) 48px, transparent 48px); background-repeat: no-repeat; }
.fcard.back { border-top-color: var(--good); background-image: none; }
.fc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.86rem; color: var(--muted); min-height: 30px; }
.fc-pos { font-family: var(--f-mono); font-size: 0.78rem; }

<script>

async function cloudInit() {

/* --------------------------------------------------------------- engine */
function rec(id) { return S.q[id]; }

function record(id, letter) {
  const q = BY_ID.get(id); const ok = letter === q.ans;

  if (!ok) { r.mb = 1; r.m = (r.m || 0) + 1; r.ok = 0; r.ms = 0; r.okD = ''; }
  else if (r.mb && wasDue) {

    const d = dayKey();
    if (r.okD !== d) { r.ok = (r.ok || 0) + 1; r.okD = d; if (r.ok >= 2) { r.mb = 0; r.ms = 1; } }

}
/* a self-test miss (Study book cover, flashcards, mock blanks): into the Mistake Bank without touching accuracy */
function markMiss(id) {

  S.counter++;
  r.mb = 1; r.m = (r.m || 0) + 1; r.ok = 0; r.ms = 0; r.okD = ''; r.k = S.counter; r.s = S.session;
}
function firstOk(r) { return r.f !== undefined ? r.f : (r.w > 0 ? 0 : 1); }
/* default practice queue: due mistakes → unseen by priority → seen → mastered → mistakes not yet due */
function queueKey(q, jit) {
  const r = S.q[q.id]; let tier, s = basePri(q) + jit(q);

  else if (!r || !r.n) tier = 1;
  else if (r.ms) tier = 3;
  else if (r.mb) tier = 4;

}
function byQueue(list) { const jit = makeJit(); return list.slice().sort((a, b) => queueKey(a, jit) - queueKey(b, jit)); }
function byPriority(list) { const jit = makeJit(); return list.slice().sort((a, b) => (basePri(b) + jit(b)) - (basePri(a) + jit(a))); }
function takeUnique(list, n, used) { used = used || new Set(); const out = []; for (const q of list) { if (out.length >= n) break; if (used.has(q.conceptId)) continue; used.add(q.conceptId); out.push(q); } return out; }

function buildMock(preferUnseen) {
  const jit = makeJit(); const used = new Set(); const out = [];
  for (const ch of CHS) {
    const key = q => (preferUnseen && !seen(q) ? 100 : 0) + basePri(q) + jit(q);
    const pool = BANK.filter(q => q.ch === ch).sort((a, b) => key(b) - key(a));
    const picked = []; const perSub = {};
    for (const sub of SUBS_OF[ch]) {
      const q = pool.find(x => x.sub === sub && !used.has(x.conceptId));
      if (q) { picked.push(q); used.add(q.conceptId); perSub[sub] = 1; }
    }
    for (const q of pool) {
      if (picked.length >= 10) break;
      if (picked.includes(q) || used.has(q.conceptId) || (perSub[q.sub] || 0) >= 3) continue;
      picked.push(q); used.add(q.conceptId); perSub[q.sub] = (perSub[q.sub] || 0) + 1;

}
function buildChapter(ch, n) {

}
function buildSub(sub, n) { const pool = byPriority(BANK.filter(q => q.sub === sub)); return takeUnique(pool, Math.min(n, pool.length)).map(q => q.id); }

  return byPriority(BANK.filter(q => isDue(S.q[q.id]))).sort((a, b) => ((S.q[b.id].m >= 2) - (S.q[a.id].m >= 2)));
}

}

function stats() {

const $app = document.getElementById('app'), $top = document.getElementById('top'), $bottom = document.getElementById('bottom'),

const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const mathCache = new Map();
const TEX_SYM = { pi: 'π', times: '×', cdot: '·', le: '≤', ge: '≥', approx: '≈', sqrt: '√', phi: 'φ', sigma: 'σ', tau: 'τ', rho: 'ρ', gamma: 'γ', theta: 'θ', Delta: 'Δ', Sigma: 'Σ', mu: 'μ', circ: '°', propto: '∝', int: '∫', nabla: '∇', partial: '∂', beta: 'β', nu: 'ν', eta: 'η', kappa: 'κ', varepsilon: 'ε', max: 'max', min: 'min', sin: 'sin', cos: 'cos', tan: 'tan' };
const SUPS = { 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
function mathFallback(tex) {
  let t = tex;
  for (let i = 0; i < 8; i++) {
    const before = t;
    t = t.replace(/([\^_])\{([^{}]*)\}/g, '$1$2').replace(/\\(?:text|mathrm)\{([^{}]*)\}/g, '$1')
      .replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)').replace(/\\sqrt\{([^{}]*)\}/g, '√($1)');
    if (t === before) break;
  }
  t = t.replace(/\^(\d)(?!\d)/g, (m, d) => SUPS[d]).replace(/\\([a-zA-Z]+)/g, (m, w) => TEX_SYM[w] || w).replace(/[{}]/g, '').replace(/_/g, '');
  return '<span class="mathfallback">' + esc(t) + '</span>';
}
function mathHTML(tex) {
  if (mathCache.has(tex)) return mathCache.get(tex);
  let out = null;
  if (window.katex) { try { out = window.katex.renderToString(tex, { throwOnError: false, output: 'html' }); } catch (e) { out = null; } }
  if (out) { mathCache.set(tex, out); return out; }
  return mathFallback(tex);
}
function md(text) {
  if (!text) return '';
  return String(text).split('$').map((p, i) => (i % 2 ? mathHTML(p) : esc(p))).join('');
}
/* render every formula once in idle time so the Study book and first questions open faster */
const idle = cb => (window.requestIdleCallback ? window.requestIdleCallback(cb, { timeout: 600 }) : setTimeout(cb, 40));
function warmMath() {
  const segs = [];
  for (const q of BANK) for (const t of [q.stem, q.reason, q.note, q.options.A, q.options.B, q.options.C, q.options.D]) if (t) String(t).split('$').forEach((x, i) => { if (i % 2) segs.push(x); });
  let i = 0;
  const step = () => { const end = performance.now() + 8; while (i < segs.length && performance.now() < end) mathHTML(segs[i++]); if (i < segs.length) idle(step); };
  idle(step);
}
function subLabel(q) { return `Ch ${q.ch} · ${q.sub} ${esc(q.subName)}`; }
function splitReason(q) {
  const parts = (q.reason || '').split(' · ');
  const main = [], sw = [], dep = [];
  for (const p of parts) { if (/^Switch:/.test(p)) sw.push(p.replace(/^Switch:\s*/, '')); else if (/^Depends on:/.test(p)) dep.push(p.replace(/^Depends on:\s*/, '')); else main.push(p); }
  return { main: main.join(' · '), sw: sw.join(' '), dep: dep.join(' ') };
}
function explanation(q) {
  const rs = splitReason(q);
  let h = `<p>${md(rs.main)}</p>`;
  if (q.wording) h += `<p class="line-wording"><b>WORDING</b> The past-paper wording is flawed; the key shown is the best exam pick.${rs.sw ? ' Switch: ' + md(rs.sw) : ''}</p>`;
  else if (rs.sw) h += `<p class="line-wording"><b>SWITCH</b> ${md(rs.sw)}</p>`;
  if (rs.dep) h += `<p class="line-dep">Depends on: ${md(rs.dep)}</p>`;
  if (q.note) h += `<p class="line-note"><b>NOTE</b> ${md(q.note)}</p>`;
  return h;
}

/* max = questions a full run really contains (near-duplicates removed); pool = questions in the set */
function nPicker(kind, opts, max, pool) {
  const btns = opts.filter(n => n < max).map(n => `<button class="btn" data-act="start-n" data-kind="${kind}" data-n="${n}">${n}</button>`);
  btns.push(`<button class="btn primary" data-act="start-n" data-kind="${kind}" data-n="${max}">All ${max}</button>`);
  const held = (pool || max) - max;
  return `<div class="row">${btns.join('')}</div>${held > 0 ? `<p class="small muted">${held} near-duplicate${held === 1 ? '' : 's'} held back so the same fact is not asked twice in one run; they come in your next run.</p>` : ''}`;
}
function bar(name, frac, label) {
  const pct = Math.round(Math.max(0, Math.min(1, frac)) * 100);
  return `<div class="bar"><span class="name" title="${esc(name)}">${md(name)}</span><span class="meter"><i style="width:${pct}%;background:${heatColor(frac)}"></i></span><span class="v">${esc(label)}</span></div>`;
}
function heatColor(f) { if (f == null) return 'var(--none)'; const p = Math.round(Math.max(0, Math.min(1, f)) * 100); return p >= 50 ? `color-mix(in srgb, var(--good) ${(p - 50) * 2}%, var(--warn))` : `color-mix(in srgb, var(--warn) ${p * 2}%, var(--bad))`; }

function tick() {

  if (document.visibilityState === 'visible' && dt < 5000) a.elapsed += dt;
  updateClock();
  if (a.elapsed >= a.limit) { stopTicker(); toast('Time is up. Your mock was submitted.'); submitExam(); return; }
  if (Math.floor(a.elapsed / 30000) !== Math.floor((a.elapsed - dt) / 30000)) persist();

const STUDY_FILTERS = [['all', 'All'], ['hi', 'R3+'], ['r5', 'R5+'], ['miss', 'Mistakes'], ['star', 'Starred'], ['last', 'Last day']];

/* ------------------------------------------------------------- flashcards */
let flashBack = false, swipeLock = false;
const FLASH_DECKS = [['all', 'All'], ['hi', 'R3+'], ['r5', 'R5+'], ['miss', 'Mistakes'], ['star', 'Starred']];
function flashDeck() { const d = S.flash.deck; return d === 'all' ? BANK : BANK.filter(q => studyMatch(q, d)); }
function flashGet() { const d = S.flash.deck; return d === 'all' ? (S.flash.idx || 0) : d === 'star' ? (S.flash.sidx || 0) : ((S.flash.pos || {})[d] || 0); }
function flashSetPos(i) { const d = S.flash.deck; if (d === 'all') S.flash.idx = i; else if (d === 'star') S.flash.sidx = i; else { S.flash.pos = S.flash.pos || {}; S.flash.pos[d] = i; } }

    <div class="stem${back ? ' stem-back' : ''}">${md(q.stem)}</div>

    ${back ? `<div class="fc-exp stack" style="gap:8px">${explanation(q)}<div class="selfmark">${S.q[q.id] && S.q[q.id].mb ? '<span class="small muted">In your Mistake Bank</span>' : `<button class="btn small" data-act="self-miss" data-id="${q.id}">✗ I missed it</button>`}</div></div>` : `<p class="fc-hint">${S.flash.opts ? '' : 'Options hidden. '}Tap the card to see the answer</p>`}`;
}
VIEWS.flash = function () {

  }

    <div class="fc-head"><p class="eyebrow">${S.flash.deck !== 'all' ? esc(FLASH_DECKS.find(x => x[0] === S.flash.deck)[1]) + ' · ' : ''}Chapter ${q.ch} · ${esc(META.chapters[q.ch].name)}</p>

function flashMove(d) {

      ${hiUnseen.length ? `<button class="btn primary" data-act="practice-hiunseen">Practise these ${hiUnseen.length}</button><div class="table-wrap"><table><tbody>${hiUnseen.map(q => `<tr><td class="n">#${q.id}</td><td>${q.sub} ${esc(META.subs[q.sub])}</td></tr>`).join('')}</tbody></table></div>` : '<p>All R4+ questions have been seen.</p>'}</div>
  </div>`;
};

/* ------------------------------------------------------------- settings */
VIEWS.settings = function () {
  setTop(homeTop('Data & settings')); setBottom('');
  const t = S.settings.theme;
  $app.innerHTML = `<div class="stack">
    <h2>Data & settings</h2>
    <div class="card stack"><h3>Theme</h3><div class="seg" role="group" aria-label="Theme">${['system', 'light', 'dark'].map(x => `<button data-act="theme" data-t="${x}" aria-pressed="${t === x}">${x[0].toUpperCase() + x.slice(1)}</button>`).join('')}</div></div>
    <div class="card stack"><h3>Where progress is kept</h3>
      <p>${storageOK ? 'Saved in this browser after every answer.' : '<span style="color:var(--bad)">This browser is blocking storage.</span>'} ${cloud.status === 'on' ? 'A copy is also kept with your Claude account, so it follows you to other devices.' : 'Export a backup now and then, especially before clearing browser data.'}</p>
      <div class="row"><button class="btn primary" data-act="export">Export progress (JSON)</button><label class="btn" for="importFile">Import from file</label><input type="file" id="importFile" accept="application/json,.json" hidden></div>
      <div id="exportBox"></div>
      <details><summary>Paste a backup instead</summary><div class="stack"><textarea id="importText" placeholder="Paste exported JSON here"></textarea><button class="btn" data-act="import-text">Import pasted JSON</button></div></details>
    </div>
    <div class="card stack"><h3>Reset</h3><p class="small muted">Erases every answer, the Mistake Bank, mock history and any unfinished test.</p><button class="btn danger" data-act="reset-ask">Reset all progress</button></div>
    <p class="small muted">Question bank: 646 MCQs from NEC Civil Chapterwise Repeated MCQs, 2nd edition, with its answer key and reasons. ${S.counter} answers recorded, session ${S.session}.</p>
  </div>`;
  document.getElementById('importFile').addEventListener('change', ev => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    const rd = new FileReader(); rd.onload = () => askImport(String(rd.result)); rd.readAsText(f); ev.target.value = '';
  });
};
function exportJSON() { return JSON.stringify({ app: 'nec-civil-quiz', exportedAt: new Date().toISOString(), state: S }); }
async function doExport() {
  const data = exportJSON(); const name = `nec-civil-progress-${new Date().toISOString().slice(0, 10)}.json`;
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data }); toast('Backup saved.'); return; }
    catch (e) { if (e && e.code === 'declined') { toast('Save cancelled.'); return; } }
  }
  const box = document.getElementById('exportBox');
  if (box) { box.innerHTML = `<p class="small">Copy this text and keep it somewhere safe (a note or an email to yourself).</p><textarea id="exportText" readonly>${esc(data)}</textarea><button class="btn" data-act="copy-export">Copy</button>`; }
}
function askImport(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { toast('That is not valid JSON. Paste the full exported text.'); return; }
  const st = obj && obj.state ? obj.state : obj;
  if (!st || st.app !== 'nec-civil-quiz' || typeof st.q !== 'object') { toast('This file is not an NEC Civil progress backup.'); return; }
  const n = Object.values(st.q).filter(r => r && r.n).length;
  pendingImport = normalize(st);
  openLayer(`<h3>Import this backup?</h3><p>It has ${n} attempted questions and ${(st.history || []).length} mock results.</p><div class="row"><button class="btn" data-act="layer-close">Cancel</button><button class="btn" data-act="import-merge">Merge with mine</button><button class="btn primary" data-act="import-replace">Replace mine</button></div>`);
}
let pendingImport = null;

/* ----------------------------------------------------------------- events */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'layer-bg') { if (ev.target === el) closeLayer(); return; }
  switch (act) {
    case 'home': go({ name: 'home' }); break;
    case 'status': go({ name: 'status' }); break;
    case 'settings': go({ name: 'settings' }); break;
    case 'layer-close': closeLayer(); break;
    case 'continue': closeLayer(); if (S.active) go({ name: S.active.kind === 'exam' ? 'exam' : 'quiz' }); break;
    case 'setup': go({ name: 'setup', mode: el.dataset.mode }); break;
    case 'pick-ch': view.ch = +el.dataset.ch; render(); break;
    case 'pick-sub': view.sub = el.dataset.sub; render(); window.scrollTo(0, 0); break;
    case 'heat': go({ name: 'setup', mode: 'sub', sub: el.dataset.sub }); break;
    case 'start-mock': {
      const cb = document.getElementById('incSeen'); S.settings.includeSeen = !!(cb && cb.checked);
      startTest({ kind: 'exam', mode: 'mock', label: 'Full Mock', ids: buildMock(!S.settings.includeSeen) }); break;
    }
    case 'start-high100': startTest({ kind: 'exam', mode: 'high100', label: 'HIGH 100', ids: buildMock(false) }); break;
    case 'start-all': {
      if (S.active && S.active.kind === 'all') { go({ name: 'quiz' }); break; }
      startTest({ kind: 'all', mode: 'all', label: 'ALL questions' }); break;
    }
    case 'new-cycle': S.all = { cycle: S.all.cycle + 1, start: S.counter, order: allOrder() }; if (S.active && S.active.kind === 'all') { S.active.cur = allNext(); S.active.ans = null; } persist(); render(); break;
    case 'start-quick': startTest(practice('quick', 'Quick 10', buildQuick())); break;
    case 'start-mistakes': startTest(practice('mistakes', 'Mistakes', buildMistakes(false))); break;
    case 'start-mistakes-all': startTest(practice('mistakes', 'Mistake Bank', buildMistakes(true))); break;
    case 'start-n': {
      const n = +el.dataset.n, k = el.dataset.kind;
      if (k === 'high') startTest(practice('high', `HIGH · ${n}`, buildHigh(n)));
      else if (k === 'chapter') startTest(practice('chapter', `Chapter ${view.ch} · ${n}`, buildChapter(view.ch, n)));
      else if (k === 'sub') startTest(practice('sub', `${view.sub} · ${n}`, buildSub(view.sub, n)));
      else if (k === 'weak') startTest(practice('weak', `Weak spots · ${n}`, buildWeak(n)));
      break;
    }
    case 'confirm-start': closeLayer(); S.active = null; doStart(pendingStart); break;
    case 'answer': answerPractice(el.dataset.l); break;
    case 'next': nextPractice(); break;
    case 'end-practice': askEndPractice(); break;
    case 'end-confirm': closeLayer(); finishPractice(); break;
    case 'exam-answer': { const a = S.active; const id = a.ids[a.idx]; if (a.ans[id] === el.dataset.l) break; a.ans[id] = el.dataset.l; a.touched = Date.now(); persist(); render(); break; }
    case 'exam-clear': { const a = S.active; delete a.ans[a.ids[a.idx]]; a.touched = Date.now(); persist(); render(); break; }
    case 'exam-prev': if (S.active.idx > 0) { S.active.idx--; S.active.touched = Date.now(); persist(); render(); window.scrollTo(0, 0); } break;
    case 'exam-next': if (S.active.idx < S.active.ids.length - 1) { S.active.idx++; S.active.touched = Date.now(); persist(); render(); window.scrollTo(0, 0); } else examGrid(); break;
    case 'exam-flag': { const a = S.active; const id = a.ids[a.idx]; a.flags[id] = !a.flags[id]; a.touched = Date.now(); persist(); render(); break; }
    case 'exam-grid': examGrid(); break;
    case 'exam-goto': S.active.idx = +el.dataset.i; S.active.touched = Date.now(); persist(); closeLayer(); render(); window.scrollTo(0, 0); break;
    case 'exam-first-unanswered': { const a = S.active; const i = a.ids.findIndex(id => !a.ans[id]); if (i >= 0) { a.idx = i; a.touched = Date.now(); persist(); closeLayer(); render(); window.scrollTo(0, 0); } break; }
    case 'exam-first-flag': { const a = S.active; const i = a.ids.findIndex(id => a.flags[id]); if (i >= 0) { a.idx = i; a.touched = Date.now(); persist(); closeLayer(); render(); window.scrollTo(0, 0); } break; }
    case 'exam-submit-ask': {
      const a = S.active; const un = a.ids.filter(id => !a.ans[id]).length;
      openLayer(`<h3>Submit the mock?</h3><p>${un ? `<b>${un} unanswered.</b> There is no negative marking, so a guess can only help.` : 'All 100 answered.'}</p><div class="row"><button class="btn" data-act="exam-grid">Back to the grid</button><button class="btn primary" data-act="exam-submit">Submit and see results</button></div>`); break;
    }
    case 'exam-submit': closeLayer(); submitExam(); break;
    case 'res-filter': view.filter = el.dataset.f; render(); break;
    case 'jump': { view.filter = view.filter === 'all' ? 'all' : 'missed'; render(); const t = document.getElementById('rv' + el.dataset.id); if (t) t.scrollIntoView({ block: 'start' }); break; }
    case 'open-result': go({ name: 'results', hid: el.dataset.hid }); break;
    case 'practice-misses': {
      const res = S.history.find(h => h.id === el.dataset.hid); if (!res) break;
      const ids = res.ids.filter(id => res.ans[id] !== BY_ID.get(id).ans);
      const ordered = BANK.filter(q => ids.includes(q.id)).sort((a, b) => b.r - a.r);
      startTest(practice('review', 'Mock misses', takeUnique(ordered, ordered.length).map(q => q.id))); break;
    }
    case 'practice-hiunseen': { const list = byPriority(BANK.filter(q => q.r >= 4 && !seen(q))); startTest(practice('hiunseen', 'Unseen R4+', takeUnique(list, list.length).map(q => q.id))); break; }
    case 'peek': {
      const q = BY_ID.get(+el.dataset.id); const r = S.q[q.id];
      openLayer(`<div class="row"><h3>#${q.id}</h3><div class="spacer"></div><button class="iconbtn" data-act="layer-close">Close</button></div><div class="qmeta"><span>${subLabel(q)}</span></div><p class="small muted">Missed ${r.m}× · ${isDue(r) ? 'due now' : 'not due yet'}. The answer stays hidden until you practise it.</p><div>${md(q.stem)}</div>`); break;
    }
    case 'theme': S.settings.theme = el.dataset.t; persist(); render(); break;
    case 'fullscreen': toggleFs(); break;
    case 'flash': flashBack = false; go({ name: 'flash' }); break;
    case 'study': go({ name: 'study' }); break;
    case 'study-filter': {
      S.study.filter = el.dataset.f; S.study.pos = null; persist();
      if (studyNode && studyNode.isConnected) { studyNode.querySelectorAll('[data-act="study-filter"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === S.study.filter))); studyApplyFilter(); window.scrollTo(0, 0); studyLastCh = 0; setTimeout(studyTrack, 50); }
      else render();
      break;
    }
    case 'study-last': S.study.filter = 'last'; S.study.pos = null; persist(); go({ name: 'study' }); break;
    case 'self-miss': {
      const id = +el.dataset.id; markMiss(id); persist();
      if (view.name === 'study') studyRefreshMarks(); else { el.outerHTML = '<span class="small muted">In your Mistake Bank</span>'; }
      toast('Added to your Mistake Bank.'); break;
    }
    case 'study-cover': { S.study.cover = !S.study.cover; persist(); const st = document.getElementById('study'); if (st) { st.classList.toggle('covered', S.study.cover); st.querySelectorAll('.sq.open').forEach(x => x.classList.remove('open')); } el.setAttribute('aria-pressed', String(S.study.cover)); el.textContent = S.study.cover ? 'Uncover' : 'Cover'; break; }
    case 'study-reveal': { const it = el.closest('.sq'); if (it && S.study.cover && !it.classList.contains('open')) it.classList.add('open'); break; }
    case 'study-star': { const id = +el.dataset.id; if (S.flash.star[id]) delete S.flash.star[id]; else S.flash.star[id] = 1; persist(); studyRefreshMarks(); break; }
    case 'study-contents': studyContents(); break;
    case 'study-jump': { closeLayer(); studyScrollTo(el.dataset.t); break; }
    case 'flip': flashFlip(); break;
    case 'flash-next': flashMove(1); break;
    case 'flash-prev': flashMove(-1); break;
    case 'flash-star': { const deck = flashDeck(); const q = deck[flashPos(deck)]; if (S.flash.star[q.id]) delete S.flash.star[q.id]; else S.flash.star[q.id] = 1; persist();
      if ((S.flash.deck === 'star' || S.flash.deck === 'last') && !S.flash.star[q.id]) { flashBack = false; render(); } else { el.setAttribute('aria-pressed', String(!!S.flash.star[q.id])); el.textContent = S.flash.star[q.id] ? '★' : '☆'; toast(S.flash.star[q.id] ? 'Starred.' : 'Star removed.'); }
      break; }
    case 'flash-contents': flashContents(); break;
    case 'flash-deck': S.flash.deck = el.dataset.d; flashBack = false; persist(); closeLayer(); go({ name: 'flash' }); break;
    case 'flash-jump': S.flash.deck = 'all'; S.flash.idx = +el.dataset.i; flashBack = false; persist(); closeLayer(); go({ name: 'flash' }); break;
    case 'export': doExport(); break;
    case 'copy-export': {
      const ta = document.getElementById('exportText');
      try { await navigator.clipboard.writeText(ta.value); toast('Copied.'); } catch (e) { ta.focus(); ta.select(); toast('Selected. Use your device’s Copy.'); }
      break;
    }
    case 'import-text': { const ta = document.getElementById('importText'); if (ta && ta.value.trim()) askImport(ta.value.trim()); else toast('Paste the exported JSON first.'); break; }
    case 'import-replace': if (pendingImport) { S = pendingImport; pendingImport = null; S.resetAt = Date.now(); persist(); cloudSchedule(0); closeLayer(); toast('Progress imported.'); go({ name: 'home' }); } break;
    case 'import-merge': if (pendingImport) { const keep = S.settings; S = mergeStates(S, pendingImport); S.settings = keep; pendingImport = null; persist(); closeLayer(); toast('Backup merged.'); go({ name: 'home' }); } break;
    case 'reset-ask': openLayer(`<h3>Reset all progress?</h3><p>This erases ${stats().att} attempted questions, the Mistake Bank and ${S.history.length} mock results on this device${cloud.status === 'on' ? ' and in your account copy' : ''}. Export first if you might want them back.</p><div class="row"><button class="btn" data-act="layer-close">Cancel</button><button class="btn danger" data-act="reset-do">Yes, erase everything</button></div>`); break;
    case 'reset-do': { const theme = S.settings.theme; S = fresh(); S.settings.theme = theme; S.resetAt = Date.now(); touchSession(); persist(); cloudSchedule(0); studyNode = null; closeLayer(); toast('Progress reset.'); go({ name: 'home' }); break; }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.target.closest('input, textarea') || $layer.innerHTML) { if (ev.key === 'Escape') closeLayer(); return; }
  const k = ev.key.toLowerCase();
  const idx = ['1', '2', '3', '4'].indexOf(k) >= 0 ? ['1', '2', '3', '4'].indexOf(k) : ['a', 'b', 'c', 'd'].indexOf(k);
  if (view.name === 'quiz' && S.active) {
    const btn = idx >= 0 ? document.querySelector(`[data-act="answer"][data-l="${LETTERS[idx]}"]:not(:disabled)`) : null;
    if (btn) { btn.click(); ev.preventDefault(); }
    else if ((k === 'enter' || k === 'arrowright') && document.querySelector('[data-act="next"]')) { nextPractice(); ev.preventDefault(); }
  } else if (view.name === 'flash') {
    if (k === 'arrowright') { flashMove(1); ev.preventDefault(); }
    else if (k === 'arrowleft') { flashMove(-1); ev.preventDefault(); }
    else if (k === ' ' || k === 'enter') { flashFlip(); ev.preventDefault(); }
    else if (k === 's') { const b = document.querySelector('[data-act="flash-star"]'); if (b) b.click(); }
  } else if (view.name === 'exam' && S.active) {
    if (idx >= 0) { const b = document.querySelector(`[data-act="exam-answer"][data-l="${LETTERS[idx]}"]`); if (b) { b.click(); ev.preventDefault(); } }
    else if (k === 'arrowright' || k === 'enter') { document.querySelector('[data-act="exam-next"]').click(); ev.preventDefault(); }
    else if (k === 'arrowleft') { const b = document.querySelector('[data-act="exam-prev"]'); if (b && !b.disabled) b.click(); }
    else if (k === 'f') document.querySelector('[data-act="exam-flag"]').click();
  }
});
window.addEventListener('pagehide', () => writeLocal());

render();
setTimeout(warmMath, 1200);
cloudInit();
</script>
